# docker compose up --build  → 서비스 :8000, Prometheus :9090, Grafana :3000 (admin/admin)
# 확인함 (11-19, Docker Desktop 4.99 / WSL2): 세 서비스 기동, /detect 응답, Prometheus up=1, Grafana 대시보드 쿼리 5개 모두 데이터 반환
services:
  vb-detect:
    build: .
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [vb-detect]
  grafana:
    image: grafana/grafana:11.3.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
